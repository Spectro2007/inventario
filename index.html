<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion inventario ADSO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="login-fondo">
    <main class="login-car">
        <header class="login-encabezado">
            <i class="bi bi-shop display-4 text-sena">
            </i>
            <h1 class="h3 fw-bold">
                Inventario Sena
            </h1>
            <p class="text-secondary mb-z">
                Ingresa tus credenciales para continuar
            </p>
        </header>
        <!--
        GET Envía los datos del formulario
        POST Envía los datos del formulario ocultos dentro del cuerpo-->
        <form action="dashboard.html" method="get">
            <div class="form-floating mb-3">
                <input type="email" id="correo" placeholder="sena@gmail.com" class="form-control" required>
                <label for="correo">
                    <i class="bi bi-envelope me-1"></i>
                    Correo Electronico
                </label>    
            </div>
            <div class="form-floating mb-3">
                <input type="password" id="password" placeholder="min 6 caracteres" minlength="6" class="form-control"
                    required>
                <label for="password">
                    <i class="bi bi-lock m-1"></i>
                    Contraseña
                </label>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">

                <label for="recordar" class="form-check-label">recordarme</label>
                <input type="checkbox" id="recordar" class="form-check-input">
            </div>
            <p>
                <a href="#" class="small text-decoration-none">olvido su contraseña?</a>
            </p>
        </div>    
            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold" id="boton">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Ingresar</button>
        </form>
        <p class="login-pie">
            ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Registrate</a>
        </p>
        <footer class="login-pie">
            2026 SENA - ADSO Mixto
        </footer>
    </main>
</body>

</html>
